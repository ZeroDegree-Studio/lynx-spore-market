name: Update Spore Index

on:
  push:
    branches: [main]
    paths:
      - 'spores/**'
      - 'tools/generate_index.py'
      - '.github/workflows/update-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-spore-index
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate index.json
        run: python tools/generate_index.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet index.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to index.json"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat index.json
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore: auto-update spore index [skip ci]"
          git push
